[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decision-swarm"
version = "0.5.0"
description = "Assemble a swarm of Laya decision-model sensors over one observation and package it as a runnable artifact (Python library + CLI)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Decision Swarm contributors" }]
keywords = ["laya", "decision-models", "swarm", "sensors", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["huggingface_hub>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The official MCP SDK, used only by tests/test_mcp_conformance.py (which skips
# when it is absent). Never a runtime dependency: the engine ships frozen.
conformance = ["mcp>=1.0"]

[project.scripts]
decision-swarm = "decision_swarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_swarm"]

[tool.hatch.build.targets.wheel.force-include]
"registry/models.json" = "decision_swarm/data/registry/models.json"
"templates/runtime" = "decision_swarm/data/templates/runtime"

[tool.pytest.ini_options]
testpaths = ["tests"]
