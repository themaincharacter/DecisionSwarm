name: release-cli

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install pyinstaller ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Build launcher
        run: pyinstaller --clean --noconfirm decision-swarm.spec

      - name: Smoke test the launcher
        shell: bash
        run: |
          bin=dist/decision-swarm
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" --version
          "$bin" --help

      - name: Rename for release
        shell: bash
        run: |
          bin=dist/decision-swarm
          ext=""
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; ext=".exe"; fi
          cp "$bin" "dist/decision-swarm-cli-${{ runner.os }}$ext"

      - uses: actions/upload-artifact@v4
        with:
          name: decision-swarm-cli-${{ matrix.os }}
          path: dist/decision-swarm-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
