name: release-gui

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build GUI (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            arch: x64
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            arch: arm64
          - os: macos-latest
            triple: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            arch: x64
            optional: true
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            arch: arm64
            optional: true
    env:
      HAVE_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the engine launcher
        run: |
          python -m pip install pyinstaller
          pyinstaller --clean --noconfirm decision-swarm.spec

      - name: Smoke test the launcher
        shell: bash
        run: |
          bin=dist/decision-swarm
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" --version
          "$bin" models --json > /dev/null

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # Signing and notarization only kick in when the Apple secrets are
      # configured; without them the bundles are unsigned (Gatekeeper warnings).
      - name: Import the Apple signing certificate (optional)
        if: runner.os == 'macOS' && env.HAVE_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: decisionswarm-build-keychain
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Configure Apple signing environment (optional)
        if: runner.os == 'macOS' && env.HAVE_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      # `npm run build` copies the launcher into src-tauri/binaries/ (prebuild),
      # then runs `tauri build --config src-tauri/bundle.release.json`.
      - name: Build the app and bundles
        working-directory: gui
        run: npm run build

      # Windows ships as a portable zip (no installer): tauri.windows.conf.json
      # sets bundle.targets: [], so the app + engine sidecar are zipped by hand.
      - name: Package the portable app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: gui
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $out = "src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          @(
            "Decision Swarm $version - portable Windows app.",
            "",
            "Unzip anywhere and run decision-swarm-gui.exe (keep decision-swarm.exe",
            "beside it: that is the bundled engine).",
            "",
            "Needs the Microsoft Edge WebView2 runtime. Windows 11 and current",
            "Windows 10 already have it. On older Windows 10, install it first:",
            "download the free WebView2 Evergreen Bootstrapper (2 MB) from",
            "https://developer.microsoft.com/microsoft-edge/webview2/",
            "or directly: https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          ) | Set-Content README.txt
          Compress-Archive -Force -Path src-tauri/target/release/decision-swarm-gui.exe, src-tauri/target/release/decision-swarm.exe, README.txt -DestinationPath "$out/Decision Swarm_win_${version}_${{ matrix.arch }}-portable.zip"

      # Extension globs on purpose: each bundler leaves staging files/dirs
      # beside the installer (deb ar members, the AppImage AppDir, bundle_dmg.sh)
      # and a plain `bundle/<type>/*` would drag all of it into the release.
      - uses: actions/upload-artifact@v4
        with:
          name: gui-bundles-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/portable/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Flatten bundles
        run: |
          mkdir flat
          find bundles -type f -exec cp {} flat/ \;
          ls -l flat

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            flat/*.dmg
            flat/*.deb
            flat/*.rpm
            flat/*.AppImage
            flat/*.zip
