<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decision Swarm</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Decision Swarm</h1>
      <p class="subtitle">
        Assemble a swarm of Laya decision-model sensors over one observation.
      </p>
    </header>

    <main>
      <section id="swarm-panel" class="panel">
        <h2>Swarm</h2>
        <div class="field-row">
          <label class="field">
            Pack name
            <input id="swarm-name" type="text" />
          </label>
          <label class="field">
            Cells
            <input id="cell-count" type="range" min="2" max="8" step="1" />
            <span id="cell-count-label"></span>
          </label>
        </div>

        <h3>Observation views</h3>
        <div id="views-editor"></div>
        <button id="add-view" type="button">+ view</button>
      </section>

      <section id="cells-panel" class="panel">
        <h2>Cells</h2>
        <div id="cells-grid"></div>
      </section>

      <section id="cluster-panel" class="panel">
        <h2>Cluster</h2>
        <div id="cluster-metrics" class="metrics"></div>
        <p id="cluster-hint" class="hint"></p>
        <div class="actions">
          <input id="submit-dest" type="text" value="./packs/my-swarm" aria-label="pack output directory" />
          <button id="download-models" type="button">Download models</button>
          <button id="submit-pack" type="button">Submit pack</button>
        </div>
        <label class="bundle-option">
          <input id="submit-export" type="checkbox" checked />
          <span
            title="Also writes &lt;pack&gt;.swarmpack.tar next to the pack: the pack plus the downloaded model weights, so it can be handed to someone else who has no model cache. Requires Download first; the bundle is several GB. Uncheck to produce only the small pack directory."
          >Bundle model weights into a transferable .tar</span>
        </label>
        <progress id="download-progress" max="1" value="0"></progress>
        <div id="engine-log" class="log" role="log"></div>
      </section>

      <section id="models-panel" class="panel">
        <h2>Model registry</h2>
        <div id="models-status" class="status" role="status">Loading models…</div>
        <table id="models-table">
          <thead>
            <tr>
              <th>id</th>
              <th>checkpoint</th>
              <th>modality</th>
              <th>params</th>
              <th>license</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <div id="validation" class="validation" role="status"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
